name: Fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

jobs:
  fuzz:
    name: Fuzzing (Atheris)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install (épinglé par hash)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-fuzz.txt
      - name: Run fuzzing (budget limité)
        env:
          PYTHONPATH: src
        # -runs / -max_total_time bornent l'exécution en CI ; un crash (5xx) échoue.
        run: python fuzz/fuzz_api.py -runs=20000 -max_total_time=120

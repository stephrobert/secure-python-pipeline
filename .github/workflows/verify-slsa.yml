name: Verify SLSA

# Vérifie la provenance et la signature de l'image publiée. Déclenchement manuel
# (après une release) pour éviter toute course avec le push de l'image.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de l'image à vérifier (ex : 1.0.0 ou latest)"
        required: true
        default: "latest"

permissions: {}

jobs:
  verify:
    name: Vérifier provenance et signature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # GHCR n'accepte que des noms en minuscules, et un nom de compte GitHub
      # peut en contenir. Le nom se dérive du dépôt qui tourne : un fork
      # publie et vérifie SA propre image, sans retouche.
      - name: Nom de l'image
        id: image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Vérifier l'attestation de provenance (native GitHub)
        env:
          IMAGE: ${{ steps.image.outputs.nom }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify "oci://${IMAGE}:${TAG}" --owner "${GITHUB_REPOSITORY_OWNER}"
      - name: Vérifier la signature Cosign (keyless)
        env:
          IMAGE: ${{ steps.image.outputs.nom }}
          TAG: ${{ inputs.tag }}
        run: |
          cosign verify "${IMAGE}:${TAG}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

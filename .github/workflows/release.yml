name: Release

on:
  release:
    types: [published]

# Aucune permission par défaut.
permissions: {}

jobs:
  build-and-attest:
    name: Build, push, attester et signer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # attacher la provenance a la release (Signed-Releases)
      packages: write # push vers GHCR
      id-token: write # OIDC keyless (provenance + cosign)
      attestations: write # attestations natives GitHub
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # GHCR n'accepte que des noms en minuscules, et un nom de compte GitHub
      # peut en contenir. Le nom se dérive du dépôt qui tourne : un fork
      # publie et vérifie SA propre image, sans retouche.
      - name: Nom de l'image
        id: image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Métadonnées (tags et labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.nom }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build et push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attestation de provenance SLSA (native)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.nom }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Générer le SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.nom }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # Le SBOM est attesté au registre (attest-sbom) : pas besoin de
          # l'attacher à la release, ce qui exigerait contents: write.
          upload-release-assets: false
      - name: Attester le SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.nom }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signer l'image (keyless Sigstore)
        env:
          IMAGE: ${{ steps.image.outputs.nom }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attacher la provenance à la release (Scorecard Signed-Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber
